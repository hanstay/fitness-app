name: CI

# Runs the functions build + test suites on every PR and on pushes to main,
# then deploys main to production (the deploy job at the bottom).
# The web app (public/**) is static; its one generated file is checked below.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  functions:
    name: functions build + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # The Firestore rules test suite drives the Firestore emulator, which is a
      # Java process. Temurin 21 matches the local dev setup.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # @firebase/rules-unit-testing pins firebase@10 while package.json pins 12;
      # the peer conflict is expected and known-safe, hence --legacy-peer-deps.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck / build
        run: npm run build

      # The check-in page parses Hevy CSVs with a bundle built from src/web and
      # committed under public/js/generated. Fail if it wasn't rebuilt.
      - name: Browser bundle is up to date
        run: npm run build:web && git diff --exit-code -- ../public/js/generated

      # Everything except the emulator-dependent suites (rules + LLM-fixture
      # integration tests).
      - name: Unit tests
        run: npx vitest run --exclude "**/test/rules.test.ts" --exclude "**/*.integration.test.ts"

      # Rules suite needs a live Firestore emulator; emulators:exec boots a
      # throwaway one, runs the tests, and tears it down. A demo-* project id
      # keeps the CLI fully offline (no auth / production calls).
      - name: Firestore rules tests
        run: npx firebase-tools emulators:exec --only firestore --project demo-ci "npx vitest run test/rules.test.ts"

      # LLM-backed generation, fixture-mocked (see test/fixtures/llmFixtures.ts
      # and test/README.md) — real Firestore emulator, no Anthropic API calls,
      # no key needed. --no-file-parallelism: all four files share one
      # emulator instance/project, so they must not run concurrently.
      - name: LLM generation integration tests
        run: npx firebase-tools emulators:exec --only firestore --project demo-ci "npx vitest run --no-file-parallelism test/*.integration.test.ts"

  # The Auth onCreate trigger is a 1st-gen function, which can't run on Node
  # 24, so it lives in its own Node 22 codebase (see firebase.json). No build
  # step — just check it installs and loads.
  functions-auth:
    name: functions-auth install + load
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions-auth
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions-auth/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Load the module
        run: node -e "const m = require('./index.js'); if (typeof m.seedNewUser !== 'function') throw new Error('seedNewUser not exported')"

  # Ships main to production once both test jobs above pass. Off until the
  # repository variable AUTO_DEPLOY is "true" (delete it to switch back to
  # manual deploys). Google trusts only this repo's main branch, through
  # Workload Identity Federation, so no key is stored in GitHub. One-time
  # setup: docs/auto-deploy.md.
  deploy:
    name: deploy to production
    needs: [functions, functions-auth]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    # One deploy at a time, never cancelled halfway. GitHub keeps only the
    # newest waiting run, so merges that land during a deploy are covered by
    # the next one (which ships the latest main) rather than each deploying.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # lets the job ask GitHub for the OIDC token Google checks
    env:
      FIREBASE_PROJECT: fitness-app-47a06
      FUNCTIONS_DISCOVERY_TIMEOUT: "60"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            functions-auth/package-lock.json

      # The CLI loads both codebases to discover their functions, so both
      # need their dependencies. Same peer-deps caveat as the functions job.
      - name: Install dependencies
        run: |
          npm --prefix functions ci --legacy-peer-deps
          npm --prefix functions-auth ci

      - uses: google-github-actions/auth@v3
        with:
          project_id: fitness-app-47a06
          workload_identity_provider: projects/39106506907/locations/global/workloadIdentityPools/github/providers/fitness-app
          service_account: github-deployer@fitness-app-47a06.iam.gserviceaccount.com

      # Auth codebase first, then the rest (see firebase.json). No --force:
      # a deploy that would delete a function stops here with a red check
      # instead of removing it unattended.
      - name: Deploy the auth codebase
        run: npx --yes firebase-tools@15 deploy --project "$FIREBASE_PROJECT" --only functions:auth --non-interactive

      - name: Deploy functions, hosting and rules
        run: npx --yes firebase-tools@15 deploy --project "$FIREBASE_PROJECT" --only functions:default,hosting,firestore,storage --non-interactive
