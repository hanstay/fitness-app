<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hybrid Plan">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>Program — Hybrid Training Plan</title>
<link rel="stylesheet" href="styles/theme.css">
</head>
<body>

<header class="hero">
  <div class="wrap">
    <a class="backlink" href="dashboard.html">← Dashboard</a>
    <h1 id="pageTitle">Your training program</h1>
    <p class="sub" id="pageSub">Loading…</p>
    <div class="badges" id="headerBadges"></div>
  </div>
</header>

<div class="wrap">
<div class="layout">
  <nav class="toc" id="toc">
    <button class="navtoggle" id="navtoggle">Jump to section <span class="arrow">▾</span></button>
    <div class="links" id="tocLinks">
      <div class="toc-title">Contents</div>
    </div>
  </nav>
  <main id="mainContent">
    <section id="loading"><p class="muted">Loading your program…</p></section>
  </main>
</div>
</div>

<footer class="wrap">
  <a href="dashboard.html">← Back to dashboard</a> ·
  Personal training plan · personal-trainer toolkit · General fitness coaching, not medical advice.
</footer>

<script src="update.js"></script>
<script type="module">
  import { doc, getDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
  import { db } from "./js/firebase-init.js";
  import { requireOnboarded } from "./js/auth-guard.js";

  const session = await requireOnboarded();
  if (!session) throw new Error("redirecting");
  const { user } = session;

  const summarySnap = await getDoc(doc(db, "users", user.uid, "state", "summary"));
  const programId = summarySnap.data()?.currentProgramId;

  const main = document.getElementById("mainContent");
  const tocLinks = document.getElementById("tocLinks");

  const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

  if (!programId) {
    main.innerHTML = `<section><p class="muted">No program generated yet. Go to your <a href="dashboard.html">dashboard</a> and generate one.</p></section>`;
    document.getElementById("pageSub").textContent = "No program yet";
  } else {
    const programSnap = await getDoc(doc(db, "users", user.uid, "programs", programId));
    const p = programSnap.data();

    document.getElementById("pageTitle").textContent = p.title || `${p.split} Program`;
    document.getElementById("pageSub").textContent = `${p.goalSummary || p.split} · ${p.daysPerWeek} days/week · generated ${
      p.createdAt?.toDate ? p.createdAt.toDate().toLocaleDateString() : "recently"
    }`;
    const eventBadges = (p.events || []).map((e) => `<span class="badge">📅 <b>${esc(e.name)}</b>${e.date ? ` · ${esc(e.date)}` : ""}</span>`).join("");
    document.getElementById("headerBadges").innerHTML =
      `<span class="badge">🏋️ <b>${esc(p.split)}</b></span><span class="badge"><b>${p.daysPerWeek}</b> days/week</span>${eventBadges}`;

    const sections = [];
    const add = (id, label, html) => { sections.push({ id, label }); main.insertAdjacentHTML("beforeend", `<section id="${id}">${html}</section>`); };

    // Where you are now — data-grounded snapshot
    if (p.currentState) {
      const cs = p.currentState;
      const load = cs.trainingLoad
        ? `<div class="stats">
             <div class="stat"><div class="k">Fitness (CTL)</div><div class="v">${cs.trainingLoad.ctl}</div></div>
             <div class="stat"><div class="k">Fatigue (ATL)</div><div class="v">${cs.trainingLoad.atl}</div></div>
             <div class="stat"><div class="k">Form (TSB)</div><div class="v ${cs.trainingLoad.tsb < -10 ? "warn" : ""}">${cs.trainingLoad.tsb}</div></div>
           </div>` : "";
      const highlights = (cs.highlights || []).length ? `<ul>${cs.highlights.map((h) => `<li>${esc(h)}</li>`).join("")}</ul>` : "";
      add("current", "Where you are now", `<h2><span class="dot"></span>Where you are now</h2>${load}<p>${esc(cs.summary)}</p>${highlights}`);
    }

    // Target events
    if ((p.events || []).length) {
      const rows = p.events.map((e) => `<tr><td><b>${esc(e.name)}</b></td><td>${esc(e.date || "—")}</td><td>${esc(e.weeksOut || "—")}</td><td>${esc(e.goal)}</td></tr>`).join("");
      add("events", "Target events", `<h2><span class="dot"></span>Target events</h2>
        <div class="tablescroll"><table><thead><tr><th>Event</th><th>Date</th><th>Out</th><th>Goal</th></tr></thead><tbody>${rows}</tbody></table></div>`);
    }

    // Periodized roadmap
    if ((p.roadmap || []).length) {
      const rows = p.roadmap.map((ph) => `<tr>
        <td><b>${esc(ph.phase)}</b><br><span class="muted small">${esc(ph.dates)}</span></td>
        <td>${esc(ph.focus)}</td><td>${esc(ph.lifting)}</td><td>${esc(ph.running || "—")}</td><td>${esc(ph.nutrition || "—")}</td></tr>`).join("");
      add("roadmap", "Roadmap", `<h2><span class="dot"></span>Periodized roadmap</h2>
        <div class="tablescroll"><table><thead><tr><th>Phase</th><th>Focus</th><th>Lifting</th><th>Running</th><th>Nutrition</th></tr></thead><tbody>${rows}</tbody></table></div>`);
    }

    // Weekly structure
    if ((p.weeklyStructure || []).length) {
      const rows = p.weeklyStructure.map((d) => `<div class="ex">
        <div class="row"><span class="name">${esc(d.day)}</span><span class="sets">${esc(d.focus)}</span></div>
        ${d.note ? `<div class="note">${esc(d.note)}</div>` : ""}</div>`).join("");
      add("weekly", "Weekly structure", `<h2><span class="dot"></span>Weekly structure</h2>${rows}`);
    }

    // Sessions
    p.sessions.forEach((s, i) => {
      const exercisesHtml = s.exercises.map((ex) => `
        <div class="ex">
          <div class="row"><span class="name">${esc(ex.name)}</span><span class="sets">${ex.sets} × ${esc(ex.reps)}</span></div>
          <div class="load">RIR ${esc(ex.rir)} · rest ${ex.rest_seconds}s${ex.load_note ? ` · ${esc(ex.load_note)}` : ""}</div>
          ${ex.substitution_note ? `<div class="note">Sub: ${esc(ex.substitution_note)}</div>` : ""}
        </div>`).join("");
      add(`session${i}`, `${s.day} — ${s.label}`, `<h2><span class="dot"></span>${esc(s.day)} — ${esc(s.label)}</h2>
        ${s.focus_note ? `<p class="muted small">${esc(s.focus_note)}</p>` : ""}${exercisesHtml}`);
    });

    // Running
    if (p.running) {
      const runSessions = (p.running.sessions || []).map((r) => `<div class="ex">
        <div class="row"><span class="name">${esc(r.name)}</span></div><div class="note">${esc(r.detail)}</div></div>`).join("");
      add("running", "Running", `<h2><span class="dot"></span>Running</h2><p class="muted small">${esc(p.running.pacesNote)}</p>${runSessions}`);
    }

    add("warmup", "Warm-up", `<h2><span class="dot"></span>Warm-up</h2><p>${esc(p.warmupNotes)}</p>`);
    add("progression", "Progression", `<h2><span class="dot"></span>Progression</h2><p>${esc(p.progressionRules)}</p>`);
    add("deload", "Deload", `<h2><span class="dot"></span>Deload guidance</h2><div class="callout">${esc(p.deloadGuidance)}</div>`);
    if (p.coachNotes) add("coach", "Recovery & mobility", `<h2><span class="dot"></span>Recovery &amp; mobility</h2><div class="callout warn">${esc(p.coachNotes)}</div>`);
    if (p.sportNotes) add("sport", "Event strategy", `<h2><span class="dot"></span>Event strategy</h2><div class="callout">${esc(p.sportNotes)}</div>`);
    if (p.nutritionNote) add("nutrition", "Fueling", `<h2><span class="dot"></span>Fueling</h2><p>${esc(p.nutritionNote)}</p>`);

    document.getElementById("loading").remove();
    tocLinks.insertAdjacentHTML("beforeend", sections.map((s) => `<a href="#${s.id}">${s.label}</a>`).join(""));

    // Mobile nav toggle + smooth-scroll + scrollspy (same pattern as the legacy static pages).
    const toc = document.getElementById("toc"), tgl = document.getElementById("navtoggle");
    tgl.addEventListener("click", () => toc.classList.toggle("open"));
    const links = Array.from(document.querySelectorAll("nav.toc .links a"));
    links.forEach((a) => {
      a.addEventListener("click", (e) => {
        const target = document.getElementById(a.getAttribute("href").slice(1));
        if (target) {
          e.preventDefault();
          target.scrollIntoView({ behavior: "smooth", block: "start" });
          links.forEach((l) => l.classList.remove("active"));
          a.classList.add("active");
        }
        if (window.innerWidth <= 820) toc.classList.remove("open");
      });
    });
    const map = {};
    links.forEach((a) => { map[a.getAttribute("href").slice(1)] = a; });
    const obs = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) {
          links.forEach((l) => l.classList.remove("active"));
          const act = map[e.target.id];
          if (act) act.classList.add("active");
        }
      });
    }, { rootMargin: "-20% 0px -70% 0px" });
    document.querySelectorAll("main section").forEach((s) => obs.observe(s));
  }
</script>
</body>
</html>
