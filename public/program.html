<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hybrid Plan">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>Program — Hybrid Training Plan</title>
<link rel="stylesheet" href="styles/theme.css">
</head>
<body>

<header class="hero">
  <div class="wrap">
    <a class="backlink" href="dashboard.html">← Dashboard</a>
    <h1 id="pageTitle">Your training program</h1>
    <p class="sub" id="pageSub">Loading…</p>
    <div class="badges" id="headerBadges"></div>
  </div>
</header>

<div class="wrap">
<div class="layout">
  <nav class="toc" id="toc">
    <button class="navtoggle" id="navtoggle">Jump to section <span class="arrow">▾</span></button>
    <div class="links" id="tocLinks">
      <div class="toc-title">Contents</div>
    </div>
  </nav>
  <main id="mainContent">
    <section id="loading"><p class="muted">Loading your program…</p></section>
  </main>
</div>
</div>

<footer class="wrap">
  <a href="dashboard.html">← Back to dashboard</a> ·
  Personal training plan · personal-trainer toolkit · General fitness coaching, not medical advice.
</footer>

<script src="update.js"></script>
<script type="module">
  import { doc, getDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
  import { db } from "./js/firebase-init.js";
  import { requireOnboarded } from "./js/auth-guard.js";

  const session = await requireOnboarded();
  if (!session) throw new Error("redirecting");
  const { user } = session;

  const summarySnap = await getDoc(doc(db, "users", user.uid, "state", "summary"));
  const programId = summarySnap.data()?.currentProgramId;

  const main = document.getElementById("mainContent");
  const tocLinks = document.getElementById("tocLinks");

  if (!programId) {
    main.innerHTML = `<section><p class="muted">No program generated yet. Go to your <a href="dashboard.html">dashboard</a> and generate one.</p></section>`;
    document.getElementById("pageSub").textContent = "No program yet";
  } else {
    const programSnap = await getDoc(doc(db, "users", user.uid, "programs", programId));
    const p = programSnap.data();

    document.getElementById("pageTitle").textContent = `${p.split} Program`;
    document.getElementById("pageSub").textContent = `${p.daysPerWeek} days/week · generated ${
      p.createdAt?.toDate ? p.createdAt.toDate().toLocaleDateString() : "recently"
    }`;
    document.getElementById("headerBadges").innerHTML = `<span class="badge">🏋️ <b>${p.split}</b></span><span class="badge"><b>${p.daysPerWeek}</b> days/week</span>`;

    const sections = [];

    p.sessions.forEach((session, i) => {
      const sectionId = `session${i}`;
      sections.push({ id: sectionId, label: `${session.day} — ${session.label}` });
      const exercisesHtml = session.exercises.map((ex) => `
        <div class="ex">
          <div class="row"><span class="name">${ex.name}</span><span class="sets">${ex.sets} × ${ex.reps}</span></div>
          <div class="load">RIR ${ex.rir} · rest ${ex.rest_seconds}s${ex.load_note ? ` · ${ex.load_note}` : ""}</div>
          ${ex.substitution_note ? `<div class="note">Sub: ${ex.substitution_note}</div>` : ""}
        </div>`).join("");
      main.insertAdjacentHTML("beforeend", `
        <section id="${sectionId}">
          <h2><span class="dot"></span>${session.day} — ${session.label}</h2>
          ${exercisesHtml}
        </section>`);
    });

    sections.push({ id: "warmup", label: "Warm-up" });
    main.insertAdjacentHTML("beforeend", `
      <section id="warmup"><h2><span class="dot"></span>Warm-up</h2><p>${p.warmupNotes}</p></section>`);

    sections.push({ id: "progression", label: "Progression" });
    main.insertAdjacentHTML("beforeend", `
      <section id="progression"><h2><span class="dot"></span>Progression</h2><p>${p.progressionRules}</p></section>`);

    sections.push({ id: "deload", label: "Deload" });
    main.insertAdjacentHTML("beforeend", `
      <section id="deload"><h2><span class="dot"></span>Deload guidance</h2><div class="callout">${p.deloadGuidance}</div></section>`);

    document.getElementById("loading").remove();
    tocLinks.insertAdjacentHTML("beforeend", sections.map((s) => `<a href="#${s.id}">${s.label}</a>`).join(""));

    // Mobile nav toggle + smooth-scroll + scrollspy (same pattern as the legacy static pages).
    const toc = document.getElementById("toc"), tgl = document.getElementById("navtoggle");
    tgl.addEventListener("click", () => toc.classList.toggle("open"));
    const links = Array.from(document.querySelectorAll("nav.toc .links a"));
    links.forEach((a) => {
      a.addEventListener("click", (e) => {
        const target = document.getElementById(a.getAttribute("href").slice(1));
        if (target) {
          e.preventDefault();
          target.scrollIntoView({ behavior: "smooth", block: "start" });
          links.forEach((l) => l.classList.remove("active"));
          a.classList.add("active");
        }
        if (window.innerWidth <= 820) toc.classList.remove("open");
      });
    });
    const map = {};
    links.forEach((a) => { map[a.getAttribute("href").slice(1)] = a; });
    const obs = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) {
          links.forEach((l) => l.classList.remove("active"));
          const act = map[e.target.id];
          if (act) act.classList.add("active");
        }
      });
    }, { rootMargin: "-20% 0px -70% 0px" });
    document.querySelectorAll("main section").forEach((s) => obs.observe(s));
  }
</script>
</body>
</html>
