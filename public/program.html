<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hybrid Plan">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>Program — Hybrid Training Plan</title>
<link rel="stylesheet" href="styles/theme.css">
<style>
  .adviceLink{display:none; margin-top:10px}
  #changes{position:relative}
  #changes ul{margin:0; padding-left:20px}
  #changes .dismiss{position:absolute; top:8px; right:8px; width:44px; height:44px; background:none; border:0;
    border-radius:var(--radius-sm); cursor:pointer; font-size:.95rem; color:var(--text-secondary)}

  /* Target events: a card per event instead of a table — a table's columns
     (esp. "Goal", which is a full sentence) don't have a width they can
     shrink to on a phone, so the whole table had to scroll horizontally. */
  .event-card{border:1px solid var(--border); border-radius:10px; padding:12px 14px; background:var(--card); margin:0 0 10px}
  .event-card:last-child{margin-bottom:0}
  .event-card .event-head{display:flex; justify-content:space-between; align-items:baseline; gap:8px 12px; flex-wrap:wrap}
  .event-card .event-name{font-weight:600; font-size:.94rem}
  .event-card .event-meta{font-size:.78rem; color:var(--text-secondary); white-space:nowrap}
  .event-card .event-goal{margin:6px 0 0; font-size:.85rem; color:var(--text-primary)}

  /* Roadmap: compact, always-visible phase strip — no accordion.
     minmax(0,1fr) (not bare 1fr) on every grid below: a plain `1fr` track
     won't shrink past its content's natural width, so one card with more
     text (e.g. the "This block" badge) was stealing space from the others
     and forcing uneven widths / inconsistent header wrapping. */
  .roadmap{display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:8px}
  .roadmap .ph{border:1px solid var(--border); border-radius:10px; padding:10px 12px; background:var(--card)}
  .roadmap .ph.current{border-color:var(--accent); background:var(--accent-soft)}
  .roadmap .ph .ph-name{font-family:var(--font-head); font-weight:600; font-size:.92rem; display:flex; align-items:center; gap:6px; flex-wrap:wrap}
  .phase-badge{font-size:.6rem; font-weight:700; text-transform:uppercase; letter-spacing:.5px;
    color:var(--accent-dark); background:var(--accent-soft); border:1px solid #f3cfd0; border-radius:999px; padding:2px 8px}
  .roadmap .ph .ph-dates{font-size:.76rem; color:var(--text-secondary); margin:2px 0 4px}
  .roadmap .ph .ph-focus{font-size:.82rem; color:var(--text-primary)}

  /* Week at a glance: single row, always visible, no scroll. */
  .week-strip{display:grid; grid-template-columns:repeat(7, minmax(0, 1fr)); gap:6px; margin-top:6px}
  .day-cell{display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center;
    padding:10px 4px; border-radius:10px; cursor:pointer; border:1px solid var(--border); background:var(--card);
    font-family:var(--font-body); -webkit-tap-highlight-color:transparent}
  .day-cell .d{font-size:.66rem; font-weight:700; letter-spacing:.4px; color:var(--text-secondary)}
  .day-cell .f{font-size:.72rem; font-weight:600; color:var(--text-primary); line-height:1.2;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%}
  .day-cell.rest{opacity:.6}
  .day-cell.today{border-color:var(--accent); scroll-margin-top:64px}
  .day-cell.selected{background:var(--accent); border-color:var(--accent-dark)}
  .day-cell.selected .d, .day-cell.selected .f{color:#ffffff}

  /* Numbered exercise cards. */
  .ex-grid{display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:12px; margin-top:14px}
  .ex-card{border:1px solid var(--border); border-radius:10px; padding:12px 14px; background:var(--card); min-width:0}
  .ex-card .row{display:flex; align-items:center; gap:8px}
  .ex-card .order{flex:0 0 auto; width:20px; height:20px; border-radius:50%; background:var(--accent-soft); color:var(--accent-dark);
    font-size:.68rem; font-weight:700; display:flex; align-items:center; justify-content:center}
  .ex-card .name{font-weight:600; font-size:.92rem; flex:1; min-width:0}
  /* Its own full-width line rather than sharing the name's row: `reps` can be
     a short "12" or a long descriptive phrase, and letting it sit inline
     meant a long one wrapped mid-row in an ugly half-inline, half-wrapped way. */
  .ex-card .sets{margin-top:4px; margin-left:28px; font-weight:700; font-size:.85rem; color:var(--accent-dark)}
  .ex-card .load{margin-top:7px; margin-left:28px; display:block; background:var(--bg-tint); color:var(--text-secondary);
    border:1px solid var(--border); border-radius:7px; padding:2px 8px; font-size:.72rem; font-weight:600; width:calc(100% - 28px)}
  .ex-card .sub{margin-top:6px; margin-left:28px}
  .ex-card .sub .pill{display:block; background:var(--accent-soft); color:var(--accent-dark); border:1px solid #f3cfd0;
    border-radius:7px; padding:2px 8px; font-size:.72rem; font-weight:600; width:100%}

  /* "Not right?" on an exercise, and the swap and note sheets (js/exercise-swap.js). */
  .ex-card .swapped .pill{display:flex; align-items:center; justify-content:space-between; gap:8px}
  .ex-card .undo{background:none; border:0; padding:4px 0; color:var(--accent-dark); font:inherit; font-weight:700; text-decoration:underline; cursor:pointer}
  .ex-actions{margin-top:6px; margin-left:28px}
  .link-btn{background:none; border:0; padding:6px 0; color:var(--text-secondary); font:inherit; font-size:.8rem; font-weight:600; cursor:pointer}
  .ex-menu{display:flex; gap:8px; flex-wrap:wrap; margin-top:4px}
  .ex-menu[hidden]{display:none}
  .ex-menu .btn{padding:8px 12px; font-size:.82rem}
  dialog.sheet{border:0; padding:18px 16px calc(18px + env(safe-area-inset-bottom)); margin:auto auto 0; width:100%; max-width:560px;
    max-height:88vh; overflow:auto; border-radius:var(--radius) var(--radius) 0 0; background:var(--card); color:var(--text-primary)}
  dialog.sheet::backdrop{background:rgba(23,24,26,.45)}
  .sheet-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px}
  .sheet-head h3{margin:0; font-size:1.05rem}
  .sheet-close{width:44px; height:44px; margin:-10px -8px 0 0; background:none; border:0; font-size:.95rem; color:var(--text-secondary); cursor:pointer}
  .swap-option{display:flex; gap:10px; align-items:flex-start; border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin:0 0 8px; cursor:pointer}
  .swap-option > span{display:flex; flex-direction:column; gap:2px; min-width:0}
  .swap-option input{margin-top:4px; accent-color:var(--accent)}
  .swap-option:has(input:checked){border-color:var(--accent); background:var(--accent-soft)}
  #swapScopeField[hidden], #swapApply[hidden], #swapPain[hidden], #noteSheetPain[hidden], #noteSheetDuration[hidden]{display:none}

  @media (max-width:640px){
    .ex-grid{grid-template-columns:minmax(0, 1fr)}
    .roadmap{grid-template-columns:minmax(0, 1fr)}
  }

  /* Phone-width day strip: 7 columns of full "focus" text (e.g. "Easy Run +
     Mobility") don't fit at any readable size, and shrinking the font to
     make them fit just traded overflow for illegibility. Drop the focus
     preview per-cell in favor of a status dot — the selected day's full
     name + focus is always shown in the heading right below the strip, so
     nothing is lost, just deferred to where there's room to read it. */
  @media (max-width:480px){
    .week-strip{gap:4px}
    .day-cell{padding:10px 2px; gap:6px}
    .day-cell .d{font-size:.7rem}
    .day-cell .f{display:none}
    .day-cell::after{content:""; width:6px; height:6px; border-radius:50%; background:var(--accent)}
    .day-cell.rest::after{background:var(--text-secondary)}
    .day-cell.selected::after{background:#ffffff}
  }
  .fb-said{border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin:0 0 8px}
  .fb-said .you{font-size:.8rem; color:var(--text-secondary)}
  .fb-said .you b{color:var(--accent-dark); font-weight:600}
  .fb-said .did{font-size:.9rem; margin-top:2px}
</style>
</head>
<body data-auth="pending">
<div id="authVeil"><div class="veil-spinner"></div></div>

<header class="hero">
  <div class="wrap">
    <h1 id="pageTitle">Your training program</h1>
    <p class="sub" id="pageSub">Loading…</p>
    <div class="badges" id="headerBadges"></div>
    <a id="adviceLink" href="advice.html" class="backlink adviceLink">💬 Why it's built this way — Trainer's advice →</a>
  </div>
</header>

<div class="wrap">
  <main id="mainContent" style="padding:26px 0 60px">
    <section id="loading"><p class="muted">Loading your program…</p></section>
  </main>
</div>

<footer class="wrap">
  Personal training plan · personal-trainer toolkit · General fitness coaching, not medical advice.
</footer>

<script type="module" src="js/tab-bar.js"></script>
<script src="update.js"></script>
<script type="module">
  import { doc, getDoc, collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
  import { exerciseActionsHtml, bindExerciseActions, noteKey } from "./js/exercise-swap.js";
  import { showToast } from "./js/ui-messages.js";
  import { db } from "./js/firebase-init.js";
  import { requireOnboarded } from "./js/auth-guard.js";
  import { loadCurrentProgram, dayKey, sessionsOn, weeksOut } from "./js/current-program.js";
  import { normalizeDay, todayWeekday } from "./js/days.js";
  import { groupPlan, markPlanSeen, changesDismissed, dismissChanges } from "./js/plan-updates.js";

  const session = await requireOnboarded();
  if (!session) throw new Error("redirecting");
  const { user } = session;

  const main = document.getElementById("mainContent");
  const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  // Which roadmap phase the plan is programming: the phase stored on the
  // program (set whenever it moves to a new phase), else by startDate/endDate
  // (ISO, inclusive) for older programs, else the first phase.
  const currentPhaseIndex = (roadmap, storedIndex) => {
    if (!roadmap || !roadmap.length) return 0;
    if (Number.isInteger(storedIndex)) return Math.min(Math.max(storedIndex, 0), roadmap.length - 1);
    if (!roadmap.every((ph) => ph.startDate && ph.endDate)) return 0;
    const today = new Date().toISOString().slice(0, 10);
    const idx = roadmap.findIndex((ph) => today >= ph.startDate && today <= ph.endDate);
    if (idx !== -1) return idx;
    return today > roadmap[roadmap.length - 1].endDate ? roadmap.length - 1 : 0;
  };

  try {
  const summarySnap = await getDoc(doc(db, "users", user.uid, "state", "summary"));
  const summary = summarySnap.data();

  const p = await loadCurrentProgram(user.uid, summary);
  const planId = p?.planId ?? null; // see js/plan-updates.js

  if (!p) {
    main.innerHTML = `<section><p class="muted">No program generated yet. Go to your <a href="dashboard.html">dashboard</a> and generate one.</p></section>`;
    document.getElementById("pageSub").textContent = "No program yet";
  } else {
    document.getElementById("pageTitle").textContent = p.title || `${p.split} Program`;
    document.getElementById("pageSub").textContent = `${p.goalSummary || p.split} · ${p.daysPerWeek} days/week · updated ${
      p.updatedAt?.toDate ? p.updatedAt.toDate().toLocaleDateString() : "recently"
    }`;
    const eventBadges = (p.events || []).map((e) => `<span class="badge">📅 <b>${esc(e.name)}</b>${e.date ? ` · ${esc(e.date)}` : ""}</span>`).join("");
    document.getElementById("headerBadges").innerHTML =
      `<span class="badge">🏋️ <b>${esc(p.split)}</b></span><span class="badge"><b>${p.daysPerWeek}</b> days/week</span>${eventBadges}`;
    document.getElementById("adviceLink").style.display = "inline-flex";
    markPlanSeen(user.uid, planId); // clears the dashboard's "Your plan is updated" notice

    const section = (id, label, innerHtml) => `
      <section id="${id}">
        <h2><span class="dot"></span>${esc(label)}</h2>
        ${innerHtml}
      </section>`;

    // RIR/rest only mean something for sets with a rep target — runs and
    // conditioning come through as rir "n/a" / rest 0, so leave those out.
    const loadLine = (ex) => {
      const bits = [];
      if (ex.rir && !/^n\/?a$/i.test(String(ex.rir).trim())) bits.push(`RIR ${esc(ex.rir)}`);
      if (ex.rest_seconds > 0) bits.push(`rest ${ex.rest_seconds}s`);
      if (ex.load_note) bits.push(esc(ex.load_note));
      return bits.length ? `<div class="load">${bits.join(" · ")}</div>` : "";
    };
    // Swaps are for the athlete's own current plan (a group plan's exercises
    // are shared); a group member gets "Not right?" for a check-in note only.
    const onGroupPlan = summary?.activeProgramSource === "group" && !!summary?.groupId;
    const canSwap = !onGroupPlan && planId === summary?.currentProgramId;
    const canNote = canSwap || onGroupPlan;
    // Notes on an exercise waiting for the next update, by day and exercise,
    // so its card says so; kept live, so saving or removing one shows at once.
    const pendingNotes = new Map();
    let onNotesChanged = () => {};
    if (canNote) {
      onSnapshot(query(collection(db, "users", user.uid, "feedbackNotes"), where("status", "==", "pending")), (snap) => {
        pendingNotes.clear();
        for (const d of snap.docs) {
          const n = d.data();
          if (n.exercise) pendingNotes.set(noteKey(n.day, n.exercise), { id: d.id, ...n });
        }
        onNotesChanged();
      }, (err) => console.error("[program] notes listener failed", err));
    }
    const exHtml = ({ ex, si, ei, day }, i) => `<div class="ex-card">
      <div class="row">
        <span class="order">${i + 1}</span>
        <span class="name">${esc(ex.name)}</span>
      </div>
      <div class="sets">${ex.sets} × ${esc(ex.reps)}</div>
      ${loadLine(ex)}
      ${ex.substitution_note ? `<div class="sub"><span class="pill">Sub: ${esc(ex.substitution_note)}</span></div>` : ""}
      ${canNote ? exerciseActionsHtml(p, si, ei, day, { canSwap, note: pendingNotes.get(noteKey(day, ex.name)) }) : ""}
    </div>`;

    // ---- What changed in the latest update, until closed ----
    // The update's answer to each check-in note and question answer it was
    // given: what the athlete said, then what changed.
    const feedbackTitle = (r) => r.exercise ? `${r.exercise}${r.day ? ` · ${r.day}` : ""}`
      : r.answer ? (r.day || "Your week")
      : r.text.length > 50 ? `${r.text.slice(0, 47)}…` : r.text;
    const feedbackHtml = (p.feedbackResponses || []).length ? `
      <h3 style="margin:14px 0 6px; font-size:.95rem">From your check-in</h3>
      ${p.feedbackResponses.map((r) => `<div class="fb-said">
        <div class="you">${esc(feedbackTitle(r))}${r.answer ? ` · you said <b>${esc(r.answer)}</b>` : ""}</div>
        <div class="did">${esc(r.response)}</div>
      </div>`).join("")}` : "";
    if (((p.changeSummary || []).length || feedbackHtml) && !changesDismissed(user.uid, planId)) {
      main.insertAdjacentHTML("beforeend", `
        <section id="changes">
          <h2><span class="dot"></span>What changed</h2>
          <ul class="small">${(p.changeSummary || []).map((c) => `<li>${esc(c)}</li>`).join("")}</ul>
          ${feedbackHtml}
          <button class="dismiss" id="dismissChanges" type="button" aria-label="Dismiss what changed">✕</button>
        </section>`);
      document.getElementById("dismissChanges").addEventListener("click", () => {
        dismissChanges(user.uid, planId);
        // Keep keyboard focus on the page rather than losing it with the button.
        const changes = document.getElementById("changes");
        const next = changes.nextElementSibling ?? main;
        changes.remove();
        next.tabIndex = -1;
        next.focus();
      });
    }

    // ---- Target events ----
    if ((p.events || []).length) {
      const cards = p.events.map((e) => {
        const out = weeksOut(e.date) ?? e.weeksOut;
        const meta = [e.date, out ? `${out} out` : null].filter(Boolean).join(" · ");
        return `<div class="event-card">
          <div class="event-head">
            <span class="event-name">${esc(e.name)}</span>
            ${meta ? `<span class="event-meta">${esc(meta)}</span>` : ""}
          </div>
          ${e.goal ? `<p class="event-goal">${esc(e.goal)}</p>` : ""}
        </div>`;
      }).join("");
      main.insertAdjacentHTML("beforeend", section("events", "Target events", cards));
    }

    // ---- Roadmap: compact, always-visible phase strip ----
    if ((p.roadmap || []).length) {
      const curPhase = currentPhaseIndex(p.roadmap, p.currentPhaseIndex);
      const phasesHtml = p.roadmap.map((ph, i) => `
        <div class="ph${i === curPhase ? " current" : ""}">
          <div class="ph-name">${esc(ph.phase)}${i === curPhase ? '<span class="phase-badge">This block</span>' : ""}</div>
          <div class="ph-dates">${esc(ph.dates || "")}</div>
          <div class="ph-focus">${esc(ph.focus)}</div>
        </div>`).join("");
      main.insertAdjacentHTML("beforeend", section("phases", "Periodized plan",
        `<p class="muted small">Your training moves through these phases toward your event — see <a href="advice.html">Trainer's advice</a> for the reasoning behind each one.</p>
         <div class="roadmap">${phasesHtml}</div>`));
    }

    // ---- This week: day strip + selected day's exercises ----
    const days = (p.weeklyStructure || []).length
      ? p.weeklyStructure
      : (p.sessions || [])
        .filter((s, i, all) => all.findIndex((o) => dayKey(o.day) === dayKey(s.day)) === i) // one cell per day
        .map((s) => ({ day: s.day, focus: s.label }));

    if (days.length) {
      main.insertAdjacentHTML("beforeend", section("week", "This week", `
        <div class="week-strip" id="weekStrip"></div>
        <div id="dayDetail" style="margin-top:8px"></div>`));

      const weekStrip = document.getElementById("weekStrip");
      const dayDetail = document.getElementById("dayDetail");
      const isRestDay = (d) => sessionsOn(p, d.day).length === 0;
      const todayIndex = days.findIndex((d) => normalizeDay(d.day) === todayWeekday());

      // Opens on today when the week lists it, else on the first training day.
      let selected = todayIndex !== -1 ? todayIndex : days.findIndex((d) => !isRestDay(d));
      if (selected === -1) selected = 0;

      const renderStrip = () => {
        weekStrip.innerHTML = days.map((d, i) => `
          <div class="day-cell${isRestDay(d) ? " rest" : ""}${i === todayIndex ? " today" : ""}${i === selected ? " selected" : ""}" data-i="${i}"${i === todayIndex ? ' id="today"' : ""}>
            <span class="d">${esc((d.day || "").slice(0, 3).toUpperCase())}</span>
            <span class="f">${esc(d.focus)}</span>
          </div>`).join("");
        weekStrip.querySelectorAll(".day-cell").forEach((el) => el.addEventListener("click", () => {
          selected = Number(el.dataset.i);
          renderStrip();
          renderDetail();
        }));
      };

      const renderDetail = () => {
        const d = days[selected];
        // Each exercise with where it is in p.sessions, which a swap needs.
        const exs = sessionsOn(p, d.day).flatMap((s) => {
          const si = p.sessions.indexOf(s);
          return (s.exercises || []).map((ex, ei) => ({ ex, si, ei, day: s.day }));
        });
        dayDetail.innerHTML = `
          <h3 style="margin:0 0 4px">${esc(d.day)} <span class="muted">— ${esc(d.focus)}</span>${selected === todayIndex ? ' <span class="phase-badge">Today</span>' : ""}</h3>
          ${exs.length
            ? `<div class="ex-grid">${exs.map(exHtml).join("")}</div>`
            : `<p class="muted small" style="margin-top:8px">Rest day — no exercises scheduled.</p>`}`;
        if (canNote) {
          bindExerciseActions(dayDetail, {
            programId: planId,
            program: p,
            report: (message, isError) => showToast(message, { type: isError ? "error" : "info" }),
            // A swap edits the current program in place: re-read its week.
            onChanged: async () => {
              const fresh = (await getDoc(doc(db, "users", user.uid, "programs", planId))).data();
              p.sessions = fresh?.sessions ?? p.sessions;
              p.swaps = fresh?.swaps ?? [];
              renderStrip();
              renderDetail();
            },
          });
        }
      };

      renderStrip();
      renderDetail();
      onNotesChanged = renderDetail;
    }

    document.getElementById("loading").remove();
    // The dashboard's Today card links to program.html#today, but the day
    // strip only exists once the plan has loaded — after the browser's own
    // jump to the anchor — so jump to it here.
    if (location.hash === "#today") document.getElementById("today")?.scrollIntoView();
  }
  } catch (err) {
    console.error("[program] failed to load", err);
    document.getElementById("pageSub").textContent = "Couldn't load your program.";
    main.innerHTML = `
      <section><div class="state-box">
        <p>Something went wrong loading your program.</p>
        <button class="btn secondary" type="button" onclick="location.reload()">Retry</button>
      </div></section>`;
  }
</script>
</body>
</html>
